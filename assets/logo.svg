<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Modular Lab</title>
  <desc id="desc">Logo Modular Lab con blocchi Photoshop, 3ds Max e lettering verde</desc>
  <defs>
    <linearGradient id="blueFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1688e8"/>
      <stop offset="1" stop-color="#064c9b"/>
    </linearGradient>
    <linearGradient id="redFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4949"/>
      <stop offset="1" stop-color="#a70d1d"/>
    </linearGradient>
    <linearGradient id="greenText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67ff35"/>
      <stop offset="1" stop-color="#159b28"/>
    </linearGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29333c"/>
      <stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(124 18)">
      <rect x="0" y="0" width="200" height="174" rx="34" fill="url(#blueFrame)" stroke="#39a4ff" stroke-width="5"/>
      <rect x="19" y="18" width="162" height="138" rx="20" fill="#edf4f9" stroke="#929da6" stroke-width="6"/>
      <text x="100" y="116" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="88" font-weight="900" fill="#047b9b">Ps</text>
    </g>
    <g transform="translate(352 18)">
      <rect x="0" y="0" width="200" height="174" rx="34" fill="url(#redFrame)" stroke="#ff6565" stroke-width="5"/>
      <rect x="19" y="18" width="162" height="138" rx="20" fill="#edf4f9" stroke="#929da6" stroke-width="6"/>
      <text x="100" y="108" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="94" font-weight="900" fill="#168c9a">3</text>
      <text x="100" y="140" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="25" font-weight="900" fill="#08747f">MAX</text>
    </g>
    <rect x="82" y="174" width="556" height="184" rx="25" fill="url(#plaque)" stroke="#17242c" stroke-width="8"/>
    <text x="360" y="258" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="67" font-weight="900" letter-spacing="1" fill="url(#greenText)">MODULAR</text>
    <text x="360" y="329" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="69" font-weight="900" letter-spacing="3" fill="url(#greenText)">LAB</text>
  </g>
</svg>
